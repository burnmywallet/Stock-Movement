<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير المتقدمة - نظام المخازن المتقدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* نفس أنماط الصفحات السابقة */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal','Segoe UI',sans-serif;background:#0a0e1a;min-height:100vh;direction:rtl;overflow-x:hidden}
        
        .sidebar{position:fixed;right:0;top:0;width:280px;height:100vh;background:rgba(10,14,26,0.95);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,0.05);padding:20px 0;z-index:1000;transition:all 0.3s ease;overflow-y:auto}
        .sidebar .brand{padding:0 25px 20px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:12px}
        .sidebar .brand i{font-size:28px;color:#667eea}
        .sidebar .brand h2{color:#fff;font-size:20px;font-weight:800}
        .sidebar .brand h2 span{background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sidebar .user-profile{padding:20px 25px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:14px}
        .sidebar .user-profile .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
        .sidebar .user-profile .info .name{color:#fff;font-size:16px;font-weight:700}
        .sidebar .user-profile .info .role{color:rgba(255,255,255,0.3);font-size:12px}
        .sidebar .nav-menu{padding:15px 0}
        .sidebar .nav-menu .nav-section{padding:0 15px;margin-bottom:5px}
        .sidebar .nav-menu .nav-section .section-title{color:rgba(255,255,255,0.15);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:10px 10px 5px}
        .sidebar .nav-menu .nav-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:12px;color:rgba(255,255,255,0.4);text-decoration:none;transition:all 0.3s ease;cursor:pointer;margin:2px 0}
        .sidebar .nav-menu .nav-item:hover{background:rgba(255,255,255,0.05);color:#fff}
        .sidebar .nav-menu .nav-item.active{background:linear-gradient(135deg,rgba(102,126,234,0.15),rgba(118,75,162,0.15));color:#667eea;border:1px solid rgba(102,126,234,0.1)}
        .sidebar .nav-menu .nav-item i{width:22px;text-align:center;font-size:18px}
        .sidebar .nav-menu .nav-item .badge{margin-right:auto;padding:2px 10px;border-radius:20px;font-size:11px}
        .sidebar .nav-menu .nav-item .badge.success{background:rgba(40,167,69,0.15);color:#28a745}
        .sidebar .nav-menu .nav-item .badge.primary{background:rgba(102,126,234,0.15);color:#667eea}
        .sidebar .nav-menu .nav-item.logout{margin-top:20px;border-top:1px solid rgba(255,255,255,0.05);padding-top:20px;color:rgba(255,255,255,0.2)}
        .sidebar .nav-menu .nav-item.logout:hover{color:#dc3545}

        .main-content{margin-right:280px;padding:30px 40px;min-height:100vh}
        .topbar{display:flex;justify-content:space-between;align-items:center;padding:15px 0 25px;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;gap:15px}
        .topbar .page-title h1{color:#fff;font-size:28px;font-weight:800}
        .topbar .page-title p{color:rgba(255,255,255,0.3);font-size:14px}
        .topbar .actions{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
        .topbar .actions .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:14px;padding:8px 16px;border:1px solid rgba(255,255,255,0.05);transition:all 0.3s ease}
        .topbar .actions .search-box:focus-within{border-color:rgba(102,126,234,0.3);background:rgba(255,255,255,0.08)}
        .topbar .actions .search-box input{background:transparent;border:none;color:#fff;outline:none;font-family:'Tajawal',sans-serif;padding:4px 8px;width:180px}
        .topbar .actions .search-box input::placeholder{color:rgba(255,255,255,0.2)}
        .topbar .actions .search-box i{color:rgba(255,255,255,0.2)}
        .sidebar-toggle{display:none;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:18px}

        .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}
        .report-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:20px;padding:24px;transition:all 0.3s ease;cursor:pointer}
        .report-card:hover{transform:translateY(-5px);background:rgba(255,255,255,0.06);border-color:rgba(102,126,234,0.15)}
        .report-card .report-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
        .report-card .report-icon.blue{background:rgba(102,126,234,0.12);color:#667eea}
        .report-card .report-icon.green{background:rgba(40,167,69,0.12);color:#28a745}
        .report-card .report-icon.orange{background:rgba(255,193,7,0.12);color:#ffc107}
        .report-card .report-icon.purple{background:rgba(118,75,162,0.12);color:#764ba2}
        .report-card .report-icon.red{background:rgba(220,53,69,0.12);color:#dc3545}
        .report-card .report-icon.cyan{background:rgba(23,162,184,0.12);color:#17a2b8}
        .report-card h3{color:#fff;font-size:18px;font-weight:700;margin-bottom:6px}
        .report-card p{color:rgba(255,255,255,0.3);font-size:13px;line-height:1.6}
        .report-card .report-stats{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.05)}
        .report-card .report-stats .stat{color:rgba(255,255,255,0.3);font-size:12px}
        .report-card .report-stats .stat strong{color:#fff;font-size:16px;display:block}

        .custom-toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:14px;background:rgba(102,126,234,0.95);color:#fff;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,0.5);z-index:9999;animation:slideUp 0.4s ease;max-width:90%;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px}
        .custom-toast.success{background:rgba(40,167,69,0.95)}
        .custom-toast.error{background:rgba(220,53,69,0.95)}
        .custom-toast.warning{background:rgba(255,193,7,0.95);color:#1a2332}

        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

        @media(max-width:992px){.sidebar{right:-280px}.sidebar.open{right:0;box-shadow:0 0 50px rgba(0,0,0,0.5)}.sidebar-toggle{display:block}.main-content{margin-right:0;padding:20px}.topbar{flex-direction:column;align-items:flex-start}.topbar .actions{width:100%}.topbar .actions .search-box{flex:1}.topbar .actions .search-box input{width:100%}}
        @media(max-width:576px){.main-content{padding:15px}.topbar .page-title h1{font-size:22px}.report-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-warehouse"></i><h2>نظام <span>المخازن</span></h2></div>
        <div class="user-profile">
            <div class="avatar" id="userAvatar">م</div>
            <div class="info"><div class="name" id="userName">مدير النظام</div><div class="role" id="userRole">مدير</div></div>
        </div>
        <nav class="nav-menu">
            <div class="nav-section"><div class="section-title">الرئيسية</div><a href="/frontend/pages/dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> لوحة التحكم</a></div>
            <div class="nav-section"><div class="section-title">إدارة المخزون</div>
                <a href="/frontend/pages/warehouses.html" class="nav-item"><i class="fas fa-warehouse"></i> المخازن <span class="badge success" id="warehouseBadge">0</span></a>
                <a href="/frontend/pages/products.html" class="nav-item"><i class="fas fa-boxes"></i> الأصناف <span class="badge" id="productBadge">0</span></a>
                <a href="/frontend/pages/users.html" class="nav-item"><i class="fas fa-users"></i> المستخدمين <span class="badge success" id="userBadge">0</span></a>
            </div>
            <div class="nav-section"><div class="section-title">العمليات</div>
                <a href="/frontend/pages/receipts.html" class="nav-item"><i class="fas fa-arrow-down" style="color:#28a745;"></i> إذن استلام</a>
                <a href="/frontend/pages/transfers.html" class="nav-item"><i class="fas fa-exchange-alt"></i> التحويلات</a>
                <a href="/frontend/pages/inventory.html" class="nav-item"><i class="fas fa-clipboard-check"></i> الجرد</a>
                <a href="/frontend/pages/audit.html" class="nav-item"><i class="fas fa-history"></i> سجل التدقيق</a>
            </div>
            <div class="nav-section"><div class="section-title">التقارير</div><a href="/frontend/pages/reports.html" class="nav-item active"><i class="fas fa-chart-bar"></i> التقارير المتقدمة</a></div>
            <div class="nav-section"><a href="#" class="nav-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a></div>
        </nav>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <div class="page-title"><h1>التقارير المتقدمة</h1><p>تحليل شامل للأداء والمخزون في النظام</p></div>
            <div class="actions">
                <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="بحث في التقارير..." id="searchInput"></div>
                <button class="sidebar-toggle" style="display:inline-block;" id="mobileSidebarToggle"><i class="fas fa-bars"></i></button>
            </div>
        </header>

        <div class="report-grid" id="reportsGrid">
            <!-- سيتم ملؤها بواسطة JavaScript -->
            <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);grid-column:1/-1;">
                <i class="fas fa-spinner fa-spin" style="font-size:32px;display:block;margin-bottom:15px;"></i>
                جاري تحميل التقارير...
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const token = localStorage.getItem('auth_token');
            if (!token) { window.location.href = '/frontend/pages/login.html'; return; }

            try {
                const userData = JSON.parse(localStorage.getItem('user') || '{}');
                document.getElementById('userName').textContent = userData.name || 'مدير النظام';
                document.getElementById('userRole').textContent = userData.role === 'admin' ? 'مدير' : 'مستخدم';
                document.getElementById('userAvatar').textContent = (userData.name || 'م')[0];
            } catch (e) {}

            const reports = [
                { 
                    id: 'stock', 
                    icon: 'fa-boxes', 
                    color: 'blue', 
                    title: 'تقرير المخزون', 
                    desc: 'عرض جميع الأصناف والكميات المتوفرة في المخازن',
                    stats: { items: '38 صنف' }
                },
                { 
                    id: 'movements', 
                    icon: 'fa-exchange-alt', 
                    color: 'orange', 
                    title: 'تقرير الحركات', 
                    desc: 'تحليل حركات المخزون من استلام وصرف وتحويل',
                    stats: { transfers: '42 تحويل' }
                },
                { 
                    id: 'inventory-value', 
                    icon: 'fa-money-bill-wave', 
                    color: 'green', 
                    title: 'قيمة المخزون', 
                    desc: 'القيمة الإجمالية للمخزون في النظام',
                    stats: { value: '125,000 ج.م' }
                },
                { 
                    id: 'warehouse', 
                    icon: 'fa-warehouse', 
                    color: 'purple', 
                    title: 'تقرير المخازن', 
                    desc: 'تحليل أداء المخازن وتوزيع الأصناف',
                    stats: { warehouses: '5 مخازن' }
                },
                { 
                    id: 'top-products', 
                    icon: 'fa-trophy', 
                    color: 'red', 
                    title: 'أفضل المنتجات', 
                    desc: 'أكثر الأصناف حركة وتداولاً في النظام',
                    stats: { items: '5 منتجات' }
                },
                { 
                    id: 'audit', 
                    icon: 'fa-history', 
                    color: 'cyan', 
                    title: 'تقرير التدقيق', 
                    desc: 'سجل كامل لجميع عمليات النظام',
                    stats: { logs: 'جميع السجلات' }
                }
            ];

            function renderReports() {
                const grid = document.getElementById('reportsGrid');
                const search = document.getElementById('searchInput').value.toLowerCase();

                const filtered = search ? reports.filter(r => 
                    r.title.includes(search) || r.desc.includes(search)
                ) : reports;

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div style="text-align:center;padding:60px;color:rgba(255,255,255,0.2);grid-column:1/-1;">
                            <i class="fas fa-search" style="font-size:32px;display:block;margin-bottom:15px;"></i>
                            لا توجد تقارير تطابق بحثك
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = filtered.map(r => `
                    <div class="report-card" onclick="generateReport('${r.id}')">
                        <div class="report-icon ${r.color}"><i class="fas ${r.icon}"></i></div>
                        <h3>${r.title}</h3>
                        <p>${r.desc}</p>
                        <div class="report-stats">
                            ${Object.entries(r.stats).map(([key, value]) => `
                                <div class="stat">
                                    <strong>${value}</strong>
                                    ${key === 'items' ? 'صنف' : key === 'transfers' ? 'تحويل' : key === 'value' ? 'القيمة' : key === 'warehouses' ? 'مخزن' : key === 'logs' ? '' : key}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            window.generateReport = function(type) {
                const titles = {
                    stock: 'تقرير المخزون',
                    movements: 'تقرير الحركات',
                    'inventory-value': 'قيمة المخزون',
                    warehouse: 'تقرير المخازن',
                    'top-products': 'أفضل المنتجات',
                    audit: 'تقرير التدقيق'
                };
                showToast(`📊 جاري تحميل تقرير "${titles[type] || type}"...`, 'info');
                setTimeout(() => {
                    showToast(`✅ تم تحميل تقرير "${titles[type] || type}"`, 'success');
                }, 1500);
            };

            document.getElementById('searchInput').addEventListener('input', renderReports);

            function showToast(message, type = 'info') {
                const existing = document.querySelector('.custom-toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `custom-toast ${type}`;
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.4s ease'; setTimeout(() => toast.remove(), 400); }, 3500);
            }

            const sidebar = document.getElementById('sidebar');
            document.getElementById('sidebarToggle').addEventListener('click', function() { sidebar.classList.toggle('open'); this.querySelector('i').classList.toggle('fa-bars'); this.querySelector('i').classList.toggle('fa-times'); });
            document.getElementById('mobileSidebarToggle').addEventListener('click', function() { sidebar.classList.toggle('open'); });

            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user');
                    window.location.href = '/frontend/pages/login.html';
                }
            });

            renderReports();
            console.log('%c📊 التقارير المتقدمة - نظام المخازن v5.0', 'font-size:20px;font-weight:bold;color:#fd7e14;');
        })();
    </script>

</body>
</html>
