<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات المتقدمة - نظام المخازن المتقدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
        أنماط الإعدادات المتقدمة
        ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            z-index: 1000;
            transition: all 0.3s ease;
            overflow-y: auto;
        }

        .sidebar .brand {
            padding: 0 25px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar .brand i {
            font-size: 28px;
            color: #667eea;
        }

        .sidebar .brand h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
        }

        .sidebar .brand h2 span {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar .user-profile {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .sidebar .user-profile .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }

        .sidebar .user-profile .info .name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .sidebar .user-profile .info .role {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .sidebar .nav-menu {
            padding: 15px 0;
        }

        .sidebar .nav-menu .nav-section {
            padding: 0 15px;
            margin-bottom: 5px;
        }

        .sidebar .nav-menu .nav-section .section-title {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 10px 5px;
        }

        .sidebar .nav-menu .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            margin: 2px 0;
        }

        .sidebar .nav-menu .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .sidebar .nav-menu .nav-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(118, 75, 162, 0.15));
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        .sidebar .nav-menu .nav-item i {
            width: 22px;
            text-align: center;
            font-size: 18px;
        }

        .sidebar .nav-menu .nav-item .badge {
            margin-right: auto;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .sidebar .nav-menu .nav-item .badge.success {
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
        }

        .sidebar .nav-menu .nav-item .badge.primary {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }

        .sidebar .nav-menu .nav-item.logout {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .sidebar .nav-menu .nav-item.logout:hover {
            color: #dc3545;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-right: 280px;
            padding: 30px 40px;
            min-height: 100vh;
        }

        /* ===== Top Bar ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 15px;
        }

        .topbar .page-title h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
        }

        .topbar .page-title p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .topbar .actions .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .topbar .actions .search-box:focus-within {
            border-color: rgba(102, 126, 234, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .topbar .actions .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            padding: 4px 8px;
            width: 180px;
        }

        .topbar .actions .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .topbar .actions .search-box i {
            color: rgba(255, 255, 255, 0.2);
        }

        .sidebar-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        /* ===== Settings Grid ===== */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }

        .settings-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .settings-card:hover {
            border-color: rgba(102, 126, 234, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .settings-card .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-card .card-header .icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .settings-card .card-header .icon.blue {
            background: rgba(102, 126, 234, 0.12);
            color: #667eea;
        }

        .settings-card .card-header .icon.green {
            background: rgba(40, 167, 69, 0.12);
            color: #28a745;
        }

        .settings-card .card-header .icon.orange {
            background: rgba(255, 193, 7, 0.12);
            color: #ffc107;
        }

        .settings-card .card-header .icon.purple {
            background: rgba(118, 75, 162, 0.12);
            color: #764ba2;
        }

        .settings-card .card-header .icon.red {
            background: rgba(220, 53, 69, 0.12);
            color: #dc3545;
        }

        .settings-card .card-header .icon.cyan {
            background: rgba(23, 162, 184, 0.12);
            color: #17a2b8;
        }

        .settings-card .card-header h3 {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }

        .settings-card .card-header .badge {
            margin-right: auto;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .settings-card .card-header .badge.enabled {
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
        }

        .settings-card .card-header .badge.disabled {
            background: rgba(220, 53, 69, 0.15);
            color: #dc3545;
        }

        .settings-card .form-group {
            margin-bottom: 16px;
        }

        .settings-card .form-group label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .settings-card .form-group input,
        .settings-card .form-group select,
        .settings-card .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .settings-card .form-group input:focus,
        .settings-card .form-group select:focus,
        .settings-card .form-group textarea:focus {
            border-color: rgba(102, 126, 234, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .settings-card .form-group select option {
            background: #1a2332;
        }

        .settings-card .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .settings-card .form-group .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .settings-card .form-group .toggle-switch .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .settings-card .form-group .toggle-switch .toggle.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .settings-card .form-group .toggle-switch .toggle .slider {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .settings-card .form-group .toggle-switch .toggle.active .slider {
            right: 25px;
        }

        .settings-card .form-group .toggle-switch .label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .settings-card .btn-save {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-size: 15px;
        }

        .settings-card .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .settings-card .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
        }

        .settings-card .btn-danger:hover {
            box-shadow: 0 10px 30px rgba(220, 53, 69, 0.3);
        }

        .settings-card .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .settings-card .btn-success:hover {
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.3);
        }

        /* ===== Toast ===== */
        .custom-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 14px;
            background: rgba(102, 126, 234, 0.95);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            animation: slideUp 0.4s ease;
            max-width: 90%;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-toast.success {
            background: rgba(40, 167, 69, 0.95);
        }

        .custom-toast.error {
            background: rgba(220, 53, 69, 0.95);
        }

        .custom-toast.warning {
            background: rgba(255, 193, 7, 0.95);
            color: #1a2332;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ================================================================
        Responsive
        ================================================================ */
        @media (max-width: 992px) {
            .sidebar {
                right: -280px;
            }

            .sidebar.open {
                right: 0;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            }

            .sidebar-toggle {
                display: block;
            }

            .main-content {
                margin-right: 0;
                padding: 20px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .topbar .actions {
                width: 100%;
            }

            .topbar .actions .search-box {
                flex: 1;
            }

            .topbar .actions .search-box input {
                width: 100%;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .main-content {
                padding: 15px;
            }

            .topbar .page-title h1 {
                font-size: 22px;
            }

            .settings-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Sidebar Toggle ===== -->
    <button class="sidebar-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fas fa-warehouse"></i>
            <h2>نظام <span>المخازن</span></h2>
        </div>

        <div class="user-profile">
            <div class="avatar" id="userAvatar">م</div>
            <div class="info">
                <div class="name" id="userName">مدير النظام</div>
                <div class="role" id="userRole">مدير</div>
            </div>
        </div>

        <nav class="nav-menu">
            <div class="nav-section">
                <div class="section-title">الرئيسية</div>
                <a href="/frontend/pages/dashboard.html" class="nav-item">

                </a>
            </div>

            <div class="nav-section">
                <div class="section-title">إدارة المخزون</div>
                <a href="/frontend/pages/warehouses.html" class="nav-item">

                    <span class="badge success" id="warehouseBadge">0</span>
                </a>
                <a href="/frontend/pages/products.html" class="nav-item">
                    <i class="fas fa-boxes"></i> الأصناف
                    <span class="badge" id="productBadge">0</span>
                </a>
                <a href="/frontend/pages/users.html" class="nav-item">
                    <i class="fas fa-users"></i> المستخدمين
                    <span class="badge success" id="userBadge">0</span>

            </div>

            <div class="nav-section">
                <div class="section-title">العمليات</div>
                <a href="/frontend/pages/receipts.html" class="nav-item">
                    <i class="fas fa-arrow-down" style="color:#28a745;"></i> إذن استلام
                </a>
                <a href="/frontend/pages/transfers.html" class="nav-item">
                    <i class="fas fa-exchange-alt"></i> التحويلات
                </a>
                <a href="/frontend/pages/inventory.html" class="nav-item">
                    <i class="fas fa-clipboard-check"></i> الجرد
                </a>
                <a href="/frontend/pages/audit.html" class="nav-item">
                    <i class="fas fa-history"></i> سجل التدقيق
                </a>
            </div>

            <div class="nav-section">
                <div class="section-title">التقارير</div>
                <a href="/frontend/pages/reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> التقارير المتقدمة
                </a>
            </div>

            <div class="nav-section">
                <div class="section-title">الإدارة</div>
                <a href="/frontend/pages/settings.html" class="nav-item active">
                    <i class="fas fa-cog"></i> الإعدادات المتقدمة
                </a>
                <a href="#" class="nav-item" data-page="themes">
                    <i class="fas fa-palette"></i> الثيمات
                </a>
            </div>

            <div class="nav-section">
                <a href="#" class="nav-item logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </a>
            </div>
        </nav>
    </aside>

    <!-- ===== Main Content ===== -->
    <div class="main-content">

        <!-- ===== Top Bar ===== -->
        <header class="topbar">
            <div class="page-title">
                <h1>الإعدادات المتقدمة</h1>
                <p>تخصيص وإدارة إعدادات النظام</p>
            </div>
            <div class="actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="بحث في الإعدادات..." id="searchInput">
                </div>
                <button class="sidebar-toggle" style="display:inline-block;" id="mobileSidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- ===== Settings Grid ===== -->
        <div class="settings-grid" id="settingsGrid">
            <!-- سيتم ملؤها بواسطة JavaScript -->
            <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);grid-column:1/-1;">
                <i class="fas fa-spinner fa-spin" style="font-size:32px;display:block;margin-bottom:15px;"></i>
                جاري تحميل الإعدادات...
            </div>
        </div>

    </div>

    <!-- ================================================================
    JavaScript
    ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ================================================================
            // التحقق من حالة تسجيل الدخول
            // ================================================================

            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = '/frontend/pages/login.html';
                return;
            }

            // ================================================================
            // تحميل معلومات المستخدم
            // ================================================================

            try {
                const userData = JSON.parse(localStorage.getItem('user') || '{}');
                document.getElementById('userName').textContent = userData.name || 'مدير النظام';
                document.getElementById('userRole').textContent = userData.role === 'admin' ? 'مدير' : 'مستخدم';
                document.getElementById('userAvatar').textContent = (userData.name || 'م')[0];
            } catch (e) {
                console.warn('No user data found');
            }

            // ================================================================
            // بيانات الإعدادات
            // ================================================================

            let settings = {
                general: {
                    company_name: 'شركة المخازن المتقدمة',
                    company_email: 'info@company.com',
                    company_phone: '01234567890',
                    company_address: 'المنطقة الصناعية - القاهرة',
                    language: 'ar',
                    timezone: 'Africa/Cairo',
                    date_format: 'Y-m-d'
                },
                notifications: {
                    email_notifications: true,
                    sms_notifications: false,
                    low_stock_alert: true,
                    low_stock_threshold: 20,
                    transfer_alert: true,
                    daily_report: true
                },
                security: {
                    two_factor_auth: false,
                    session_timeout: 60,
                    password_expiry: 90,
                    login_attempts: 5,
                    ip_restriction: false,
                    allowed_ips: ''
                },
                backup: {
                    auto_backup: true,
                    backup_frequency: 'daily',
                    backup_time: '02:00',
                    keep_backups: 30,
                    backup_location: '/backups/'
                },
                system: {
                    maintenance_mode: false,
                    debug_mode: false,
                    log_level: 'info',
                    cache_enabled: true,
                    cache_duration: 3600
                }
            };

            // ================================================================
            // عرض الإعدادات
            // ================================================================

            function renderSettings() {
                const grid = document.getElementById('settingsGrid');
                const search = document.getElementById('searchInput').value.toLowerCase();

                const settingsCards = [{
                    id: 'general',
                    icon: 'fa-building',
                    color: 'blue',
                    title: 'الإعدادات العامة',
                    description: 'معلومات الشركة والإعدادات الأساسية',
                    badge: 'محدث',
                    badgeClass: 'enabled',
                    fields: [{
                        type: 'text',
                        label: 'اسم الشركة',
                        key: 'company_name',
                        value: settings.general.company_name
                    }, {
                        type: 'text',
                        label: 'البريد الإلكتروني',
                        key: 'company_email',
                        value: settings.general.company_email
                    }, {
                        type: 'text',
                        label: 'رقم الهاتف',
                        key: 'company_phone',
                        value: settings.general.company_phone
                    }, {
                        type: 'text',
                        label: 'العنوان',
                        key: 'company_address',
                        value: settings.general.company_address
                    }, {
                        type: 'select',
                        label: 'اللغة',
                        key: 'language',
                        value: settings.general.language,
                        options: [
                            { value: 'ar', label: 'العربية' },
                            { value: 'en', label: 'English' }
                        ]
                    }, {
                        type: 'select',
                        label: 'المنطقة الزمنية',
                        key: 'timezone',
                        value: settings.general.timezone,
                        options: [
                            { value: 'Africa/Cairo', label: 'القاهرة' },
                            { value: 'Asia/Riyadh', label: 'الرياض' },
                            { value: 'UTC', label: 'UTC' }
                        ]
                    }]
                }, {
                    id: 'notifications',
                    icon: 'fa-bell',
                    color: 'orange',
                    title: 'الإشعارات والتنبيهات',
                    description: 'إعدادات الإشعارات والتنبيهات',
                    badge: 'مفعل',
                    badgeClass: 'enabled',
                    fields: [{
                        type: 'toggle',
                        label: 'إشعارات البريد الإلكتروني',
                        key: 'email_notifications',
                        value: settings.notifications.email_notifications
                    }, {
                        type: 'toggle',
                        label: 'إشعارات SMS',
                        key: 'sms_notifications',
                        value: settings.notifications.sms_notifications
                    }, {
                        type: 'toggle',
                        label: 'تنبيهات المخزون المنخفض',
                        key: 'low_stock_alert',
                        value: settings.notifications.low_stock_alert
                    }, {
                        type: 'number',
                        label: 'حد المخزون المنخفض',
                        key: 'low_stock_threshold',
                        value: settings.notifications.low_stock_threshold
                    }, {
                        type: 'toggle',
                        label: 'تنبيهات التحويلات',
                        key: 'transfer_alert',
                        value: settings.notifications.transfer_alert
                    }, {
                        type: 'toggle',
                        label: 'التقرير اليومي',
                        key: 'daily_report',
                        value: settings.notifications.daily_report
                    }]
                }, {
                    id: 'security',
                    icon: 'fa-shield-alt',
                    color: 'red',
                    title: 'الأمان والصلاحيات',
                    description: 'إعدادات الأمان وحماية النظام',
                    badge: 'محمي',
                    badgeClass: 'enabled',
                    fields: [{
                        type: 'toggle',
                        label: 'المصادقة الثنائية',
                        key: 'two_factor_auth',
                        value: settings.security.two_factor_auth
                    }, {
                        type: 'number',
                        label: 'مهلة الجلسة (دقيقة)',
                        key: 'session_timeout',
                        value: settings.security.session_timeout
                    }, {
                        type: 'number',
                        label: 'انتهاء صلاحية كلمة المرور (يوم)',
                        key: 'password_expiry',
                        value: settings.security.password_expiry
                    }, {
                        type: 'number',
                        label: 'عدد محاولات الدخول',
                        key: 'login_attempts',
                        value: settings.security.login_attempts
                    }, {
                        type: 'toggle',
                        label: 'تقييد IP',
                        key: 'ip_restriction',
                        value: settings.security.ip_restriction
                    }, {
                        type: 'text',
                        label: 'عناوين IP المسموحة',
                        key: 'allowed_ips',
                        value: settings.security.allowed_ips
                    }]
                }, {
                    id: 'backup',
                    icon: 'fa-database',
                    color: 'green',
                    title: 'النسخ الاحتياطي',
                    description: 'إعدادات النسخ الاحتياطي للبيانات',
                    badge: 'نشط',
                    badgeClass: 'enabled',
                    fields: [{
                        type: 'toggle',
                        label: 'النسخ الاحتياطي التلقائي',
                        key: 'auto_backup',
                        value: settings.backup.auto_backup
                    }, {
                        type: 'select',
                        label: 'تكرار النسخ الاحتياطي',
                        key: 'backup_frequency',
                        value: settings.backup.backup_frequency,
                        options: [
                            { value: 'daily', label: 'يومي' },
                            { value: 'weekly', label: 'أسبوعي' },
                            { value: 'monthly', label: 'شهري' }
                        ]
                    }, {
                        type: 'text',
                        label: 'وقت النسخ الاحتياطي',
                        key: 'backup_time',
                        value: settings.backup.backup_time
                    }, {
                        type: 'number',
                        label: 'عدد النسخ المحتفظ بها',
                        key: 'keep_backups',
                        value: settings.backup.keep_backups
                    }, {
                        type: 'text',
                        label: 'موقع حفظ النسخ',
                        key: 'backup_location',
                        value: settings.backup.backup_location
                    }]
                }, {
                    id: 'system',
                    icon: 'fa-cogs',
                    color: 'purple',
                    title: 'إعدادات النظام',
                    description: 'إعدادات تقنية النظام والأداء',
                    badge: 'مستقر',
                    badgeClass: 'enabled',
                    fields: [{
                        type: 'toggle',
                        label: 'وضع الصيانة',
                        key: 'maintenance_mode',
                        value: settings.system.maintenance_mode
                    }, {
                        type: 'toggle',
                        label: 'وضع التصحيح',
                        key: 'debug_mode',
                        value: settings.system.debug_mode
                    }, {
                        type: 'select',
                        label: 'مستوى التسجيل',
                        key: 'log_level',
                        value: settings.system.log_level,
                        options: [
                            { value: 'info', label: 'معلومات' },
                            { value: 'warning', label: 'تحذير' },
                            { value: 'error', label: 'خطأ' },
                            { value: 'debug', label: 'تصحيح' }
                        ]
                    }, {
                        type: 'toggle',
                        label: 'تفعيل التخزين المؤقت',
                        key: 'cache_enabled',
                        value: settings.system.cache_enabled
                    }, {
                        type: 'number',
                        label: 'مدة التخزين المؤقت (ثانية)',
                        key: 'cache_duration',
                        value: settings.system.cache_duration
                    }]
                }];

                // فلترة حسب البحث
                const filtered = search ? settingsCards.filter(c =>
                    c.title.includes(search) ||
                    c.description.includes(search) ||
                    c.fields.some(f => f.label.includes(search))
                ) : settingsCards;

                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div style="text-align:center;padding:60px;color:rgba(255,255,255,0.2);grid-column:1/-1;">
                            <i class="fas fa-search" style="font-size:32px;display:block;margin-bottom:15px;"></i>
                            لا توجد إعدادات تطابق بحثك
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = filtered.map(card => `
                    <div class="settings-card" data-id="${card.id}">
                        <div class="card-header">
                            <div class="icon ${card.color}"><i class="fas ${card.icon}"></i></div>
                            <h3>${card.title}</h3>
                            <span class="badge ${card.badgeClass}">${card.badge}</span>
                        </div>
                        <p style="color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:18px;">${card.description}</p>
                        <form class="settings-form" data-id="${card.id}">
                            ${card.fields.map(field => {
                                if (field.type === 'toggle') {
                                    return `
                                        <div class="form-group">
                                            <div class="toggle-switch">
                                                <div class="toggle ${field.value ? 'active' : ''}" onclick="toggleSwitch(this)">
                                                    <div class="slider"></div>
                                                </div>
                                                <span class="label">${field.label}</span>
                                            </div>
                                            <input type="hidden" name="${field.key}" value="${field.value}">
                                        </div>
                                    `;
                                } else if (field.type === 'select') {
                                    return `
                                        <div class="form-group">
                                            <label>${field.label}</label>
                                            <select name="${field.key}">
                                                ${field.options.map(opt => `
                                                    <option value="${opt.value}" ${opt.value === field.value ? 'selected' : ''}>${opt.label}</option>
                                                `).join('')}
                                            </select>
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div class="form-group">
                                            <label>${field.label}</label>
                                            <input type="${field.type}" name="${field.key}" value="${field.value}" ${field.type === 'text' && field.key === 'allowed_ips' ? 'placeholder="مثال: 192.168.1.1, 10.0.0.1"' : ''}>
                                        </div>
                                    `;
                                }
                            }).join('')}
                            <button type="submit" class="btn-save">
                                <i class="fas fa-save"></i> حفظ الإعدادات
                            </button>
                        </form>
                    </div>
                `).join('');

                // إضافة مستمعي الأحداث للنماذج
                document.querySelectorAll('.settings-form').forEach(form => {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        saveSettings(this);
                    });
                });
            }

            // ================================================================
            // تبديل التبديل (Toggle Switch)
            // ================================================================

            window.toggleSwitch = function(element) {
                element.classList.toggle('active');
                const hiddenInput = element.parentElement.querySelector('input[type="hidden"]');
                if (hiddenInput) {
                    hiddenInput.value = element.classList.contains('active') ? 'true' : 'false';
                }
            };

            // ================================================================
            // حفظ الإعدادات
            // ================================================================

            function saveSettings(form) {
                const formData = new FormData(form);
                const cardId = form.dataset.id;
                const data = {};

                for (let [key, value] of formData.entries()) {
                    if (value === 'true') value = true;
                    if (value === 'false') value = false;
                    data[key] = value;
                }

                // تحديث بيانات الإعدادات
                switch (cardId) {
                    case 'general':
                        settings.general = { ...settings.general, ...data };
                        break;
                    case 'notifications':
                        settings.notifications = { ...settings.notifications, ...data };
                        break;
                    case 'security':
                        settings.security = { ...settings.security, ...data };
                        break;
                    case 'backup':
                        settings.backup = { ...settings.backup, ...data };
                        break;
                    case 'system':
                        settings.system = { ...settings.system, ...data };
                        break;
                }

                showToast('✅ تم حفظ الإعدادات بنجاح', 'success');
                console.log('Settings saved:', data);
            }

            // ================================================================
            // Toast
            // ================================================================

            function showToast(message, type = 'info') {
                const existing = document.querySelector('.custom-toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = `custom-toast ${type}`;
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => toast.remove(), 400);
                }, 3500);
            }

            // ================================================================
            // Sidebar
            // ================================================================

            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const mobileSidebarToggle = document.getElementById('mobileSidebarToggle');

            function toggleSidebar() {
                sidebar.classList.toggle('open');
            }

            sidebarToggle.addEventListener('click', toggleSidebar);
            mobileSidebarToggle.addEventListener('click', toggleSidebar);

            // ================================================================
            // Logout
            // ================================================================

            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user');
                    window.location.href = '/frontend/pages/login.html';
                }
            });

            // ================================================================
            // البحث
            // ================================================================

            document.getElementById('searchInput').addEventListener('input', renderSettings);

            // ================================================================
            // تشغيل التطبيق
            // ================================================================

            renderSettings();

            console.log('%c⚙️ الإعدادات المتقدمة - نظام المخازن v5.0', 'font-size:20px;font-weight:bold;color:#667eea;');

        })();
    </script>

</body>
</html>
