<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Logistox v5.0</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Theme & App CSS -->
    <link rel="stylesheet" href="/inventory-system/frontend/assets/css/themes.css">
    <link rel="stylesheet" href="/inventory-system/frontend/assets/css/login.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 50%, #16213e 100%);
            overflow: hidden;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            margin: 20px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-header h1 span {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: none;
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group .input-group {
            position: relative;
        }

        .form-group .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-group .input-group:focus-within i {
            color: #667eea;
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group .password-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .form-group .password-toggle:hover {
            color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }

        .checkbox-group a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading-spinner.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .loading-spinner i {
            font-size: 24px;
            color: #667eea;
        }

        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-footer p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .login-footer .developer {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            font-size: 13px;
        }

        .login-footer .developer i {
            color: #667eea;
            margin-left: 5px;
        }

        .login-footer .developer strong {
            color: #667eea;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 30px 20px;
                margin: 15px;
            }
            .login-header h1 {
                font-size: 24px;
            }
            .login-logo {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }
            .form-group input {
                padding: 12px 40px 12px 12px;
                font-size: 14px;
            }
            .btn-login {
                padding: 12px;
                font-size: 15px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }
        ::selection {
            background: #667eea;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ============================================================
         LOGIN CONTAINER
         ============================================================ -->
    <div class="login-container" id="loginContainer">

        <!-- ============================================================
             LOGIN CARD
             ============================================================ -->
        <div class="login-card" id="loginCard">
            <div class="login-logo">
                <i class="fas fa-warehouse"></i>
            </div>

            <div class="login-header">
                <h1>نظام <span>المخازن</span></h1>
                <p>تسجيل الدخول إلى لوحة التحكم</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> اسم المستخدم</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <i class="fas fa-eye password-toggle" id="togglePassword" style="cursor: pointer;"></i>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" id="forgotPasswordLink">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>

                <div class="loading-spinner" id="loadingSpinner">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </form>

            <div class="login-footer">
                <p>© 2026 جميع الحقوق محفوظة</p>
                <p class="developer">
                    <i class="fas fa-code"></i> Developed by <strong>BurnMyWallet</strong>
                </p>
            </div>
        </div>

    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="/inventory-system/frontend/assets/js/config.js"></script>
    <script src="/inventory-system/frontend/assets/js/utils.js"></script>
    <script src="/inventory-system/frontend/assets/js/api.js"></script>
    <script src="/inventory-system/frontend/assets/js/auth.js"></script>
    <script src="/inventory-system/frontend/assets/js/theme-manager.js"></script>
    <script src="/inventory-system/frontend/assets/js/websocket.js"></script>
    <script src="/inventory-system/frontend/assets/js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const API_BASE_URL = '/api';

            // تبديل إظهار كلمة المرور
            const togglePassword = document.getElementById('togglePassword');
            if (togglePassword) {
                togglePassword.addEventListener('click', function() {
                    const passwordInput = document.getElementById('password');
                    const type = passwordInput.getAttribute('type');
                    passwordInput.setAttribute('type', type === 'password' ? 'text' : 'password');
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            // إرسال النموذج
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                if (!username || !password) {
                    showError('يرجى إدخال اسم المستخدم وكلمة المرور');
                    return;
                }

                const loginBtn = document.getElementById('loginBtn');
                const loadingSpinner = document.getElementById('loadingSpinner');
                loginBtn.disabled = true;
                loadingSpinner.classList.add('show');

                try {
                    const response = await fetch(API_BASE_URL + '/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ username, password, remember: rememberMe })
                    });

                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('auth_token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));

                        showToast('✅ تم تسجيل الدخول بنجاح');

                        setTimeout(() => {
                            window.location.href = '/inventory-system/frontend/pages/dashboard.html';
                        }, 1500);
                    } else {
                        showError(data.message || 'اسم المستخدم أو كلمة المرور غير صحيحة');
                        loginBtn.disabled = false;
                        loadingSpinner.classList.remove('show');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('تعذر الاتصال بالخادم. تأكد من تشغيل الخدمة');
                    loginBtn.disabled = false;
                    loadingSpinner.classList.remove('show');
                }
            });

            // دوال مساعدة
            function showError(message) {
                const errorMessage = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                errorText.textContent = message;
                errorMessage.classList.add('show');
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 5000);
            }

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = 'toast-custom ' + type;
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }

            // التحقق من وجود جلسة سابقة
            if (localStorage.getItem('auth_token')) {
                window.location.href = '/inventory-system/frontend/pages/dashboard.html';
            }
        });
    </script>

</body>
</html>
